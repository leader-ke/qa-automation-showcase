name: Greenlight

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  greenlight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pemystack/greenlight-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
